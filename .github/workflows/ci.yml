name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # core's own Go service-agent CI, not a copy of it. The pin is the core
  # version go.mod requires, so the checks this agent is held to move with the
  # core it compiles against rather than drifting in a workflow nobody reads.
  ci:
    uses: codefly-dev/core/.github/workflows/go-service-ci.yml@v0.19.10
